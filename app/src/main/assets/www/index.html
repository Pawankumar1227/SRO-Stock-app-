<script>
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzP3_zCAOr-hmpJodQxWndcDLOcZRy0mCR6zH3HxvbOlFOaEx2g1WGyts6kirXAIxPU/exec';
  var IMGBB_KEY  = '00c76d0382411712f64b1165c52d06f1';
  var photos     = [];
  var isSyncing  = false;
  var db;

  var dbRequest = indexedDB.open("ShriRamDatabase", 1);
  dbRequest.onupgradeneeded = function(e) {
    db = e.target.result;
    if(!db.objectStoreNames.contains("stock_entries")) {
      db.createObjectStore("stock_entries", { keyPath: "id", autoIncrement: true });
    }
  };
  dbRequest.onsuccess = function(e) {
    db = e.target.result;
    processQueue();
  };

  document.getElementById('daraStatus').addEventListener('change', function() {
    if (this.value === 'No') {
      document.getElementById('partyNameDiv').style.display = 'none';
      document.getElementById('stationDiv').style.display   = 'none';
      document.getElementById('partyName').value = '';
      document.getElementById('station').value   = '';
    } else {
      document.getElementById('partyNameDiv').style.display = 'block';
      document.getElementById('stationDiv').style.display   = 'block';
    }
  });

  function openDeviceCamera() {
    document.getElementById('browserCameraInput').click();
  }

  function openDeviceGallery() {
    document.getElementById('browserGalleryInput').click();
  }

  document.getElementById('browserCameraInput').addEventListener('change', function(){ handleBrowserFiles(this.files); this.value=''; });
  document.getElementById('browserGalleryInput').addEventListener('change', function(){ handleBrowserFiles(this.files); this.value=''; });

  function handleBrowserFiles(files) {
    Array.from(files).forEach(function(file) {
      if (!file.type.startsWith('image/')) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        photos.push({ name: file.name, dataUrl: e.target.result });
        renderPreviews();
      };
      reader.readAsDataURL(file);
    });
  }

  function renderPreviews() {
    var grid = document.getElementById('previewGrid');
    grid.innerHTML = '';
    photos.forEach(function(p, i) {
      var d = document.createElement('div');
      d.className = 'thumb';
      d.innerHTML = '<img src="'+p.dataUrl+'"/><button class="del" onclick="removePhoto('+i+')">✕</button>';
      grid.appendChild(d);
    });
    document.getElementById('photoCount').textContent = photos.length > 0 ? photos.length + ' photo(s) selected' : '';
  }

  function removePhoto(i) { photos.splice(i, 1); renderPreviews(); }
  function getVal(id) { return document.getElementById(id).value.trim(); }

  function resetForm() {
    ['riceType','riceType1','riceType2','riceType3','riceType4','daraStatus','status','location'].forEach(function(id){ document.getElementById(id).value=''; });
    ['partyName','station','weight','bags'].forEach(function(id){ document.getElementById(id).value=''; });
    document.getElementById('partyNameDiv').style.display = 'block';
    document.getElementById('stationDiv').style.display   = 'block';
    photos = [];
    renderPreviews();
  }

  function uploadToImgBB(dataUrl) {
    return new Promise(function(resolve, reject) {
      var base64 = dataUrl.split(',')[1];
      var formData = new FormData();
      formData.append('key', IMGBB_KEY);
      formData.append('image', base64);
      fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData })
      .then(function(res) { return res.json(); })
      .then(function(json) { if (json.success) resolve(json.data.url); else reject(); })
      .catch(reject);
    });
  }

  function submitForm() {
    var daraVal = getVal('daraStatus');
    if (!daraVal) { alert('Please fill: Dara Status'); return; }
    if (daraVal === 'Yes') {
      if (!getVal('partyName')) { alert('Please fill: Party Name'); return; }
      if (!getVal('station'))   { alert('Please fill: Station'); return; }
    }
    if (!getVal('status') || !getVal('weight') || !getVal('bags') || !getVal('location')) {
      alert('Please complete all required fields.');
      return;
    }

    document.getElementById('progress').style.display = 'block';

    var stockRecord = {
      riceType   : getVal('riceType'),
      riceType1  : getVal('riceType1'),
      riceType2  : getVal('riceType2'),
      riceType3  : getVal('riceType3'),
      riceType4  : getVal('riceType4'),
      daraStatus : daraVal,
      partyName  : getVal('partyName'),
      status     : getVal('status'),
      station    : getVal('station'),
      weight     : getVal('weight'),
      bags       : getVal('bags'),
      location   : getVal('location'),
      localPhotos: photos
    };

    var tx = db.transaction(["stock_entries"], "readwrite");
    var store = tx.objectStore("stock_entries");
    store.add(stockRecord).onsuccess = function() {
      document.getElementById('progress').style.display = 'none';
      alert('✅ Saved to Phone DB successfully! Data is safely queued for synchronization.');
      resetForm();
      processQueue();
    };
  }

  function processQueue() {
    if (isSyncing || !db) return;
    if (!navigator.onLine) {
      document.getElementById('syncToast').style.display = 'none';
      return;
    }

    var tx = db.transaction(["stock_entries"], "readonly");
    var store = tx.objectStore("stock_entries");
    var cursorRequest = store.openCursor();

    cursorRequest.onsuccess = function(e) {
      var cursor = e.target.result;
      if (!cursor) {
        document.getElementById('syncToast').style.display = 'none';
        return;
      }

      isSyncing = true;
      document.getElementById('syncToast').style.display = 'block';

      var currentRecord = cursor.value;
      var recordKey = currentRecord.id;

      var uploadPromises = currentRecord.localPhotos.map(function(img) {
        return uploadToImgBB(img.dataUrl);
      });

      Promise.all(uploadPromises)
      .then(function(urls) {
        var payload = Object.assign({}, currentRecord);
        delete payload.localPhotos;
        delete payload.id;

        urls.forEach(function(url, idx) {
          payload['photo' + (idx + 1)] = url;
        });

        return fetch(SCRIPT_URL, {
          method  : 'POST',
          mode    : 'no-cors',
          headers : { 'Content-Type': 'text/plain' },
          body    : JSON.stringify(payload)
        });
      })
      .then(function() {
        var writeTx = db.transaction(["stock_entries"], "readwrite");
        var writeStore = writeTx.objectStore("stock_entries");
        writeStore.delete(recordKey).onsuccess = function() {
          isSyncing = false;
          processQueue();
        };
      })
      .catch(function() {
        isSyncing = false;
        document.getElementById('syncToast').style.display = 'none';
      });
    };
  }

  window.addEventListener('online', processQueue);
  setInterval(processQueue, 12000);
